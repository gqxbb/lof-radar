name: 钉钉LOF定时全自动扫盘

on:
  workflow_dispatch:  # 人工手动触发后门
  schedule:
    - cron: '30 6 * * 1-5'

# 🍏 核心破防动作：在全机组最高层强行注入环境变量，逼迫 GitHub 开启 2026 最新 Node 24 引擎
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
    - name: 拉取最新代码
      uses: actions/checkout@v4

    - name: 准备Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装量化依赖库
      run: |
        pip install akshare pandas requests

    - name: 关联钉钉保险箱并强行发射
      env:
        DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
      run: python cron_radar.py
