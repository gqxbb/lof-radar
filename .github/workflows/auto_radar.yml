name: V1飞书LOF全自动完美扫盘

on:
  workflow_dispatch:  # 保留人工手动触发按钮
  schedule:
    - cron: '30 6 * * 1-5'  # 北京时间周一至周五下午 14:30 准时自动执行

jobs:
  run-radar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # 👑 强行粉碎一切旧环境导致的断网和卡死警告
    steps:
    - name: 1. 拉取最新代码
      uses: actions/checkout@v4

    - name: 2. 准备Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装量化依赖库
      run: |
        pip install akshare pandas requests

    - name: 4. 强行开火发射
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}  # 确保 V1 的 Settings 密码箱里也有这个飞书链接
      run: python cron_radar.py
