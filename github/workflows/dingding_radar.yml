name: 钉钉全自动完美扫盘

on:
  workflow_dispatch: # 人工手动触发后门

jobs:
  run-radar:
    runs-on: ubuntu-latest
    # 🍏 在任务层最核心位置注入最高安全级标记
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
    - name: 1. 拉取最新代码
      uses: actions/checkout@v4.1.1  # 强行锁定具体小版本

    - name: 2. 准备Python环境
      uses: actions/setup-python@v5.0.0 # 强行锁定具体小版本
      with:
        python-version: '3.10'

    - name: 3. 安装量化依赖库
      run: |
        pip install akshare pandas requests

    - name: 4. 强行开火发射
      env:
        DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
      run: python cron_radar.py
